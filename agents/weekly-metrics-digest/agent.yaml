schema_version: "1.0"
kind: ExecutionAgent
id: exec.weekly-metrics-digest
name: Weekly Metrics Digest
description: Gathers a workspace's weekly metrics, writes a short narrative digest, and posts it after approval.
purpose:
  summary: Produce a weekly written digest of key workspace metrics and deliver it to a chosen channel once a human approves the text.
  goals:
    - Summarise week-over-week movement for the requested metrics.
    - Flag anomalies with the supporting numbers.
    - Post the approved digest to the requested channel.
  non_goals:
    - Forecasting.
    - Changing any metric definition or source data.
version: 1.0.0
status: active
tags: [reporting, digest]
owners:
  - team:insights
provenance:
  origin: human_authored
  authors: [github:zeptly-bootstrap]
  created_at: "2026-09-29"
  change_ref: bootstrap
instructions:
  file: prompts/system.md
contract:
  input:
    schema_file: contracts/input.schema.json
  output:
    schema_file: contracts/output.schema.json
skills:
  - id: skill.metrics-narration
    version: 1.0.0
capabilities:
  - id: cap.analytics.query
    version: 1.0.0
    reason: Read weekly metric series.
  - id: cap.messaging.post
    version: 1.0.0
    reason: Deliver the approved digest.
tools:
  - id: tool.metrics-query
    version: 1.0.0
    capability: cap.analytics.query
  - id: tool.channel-post
    version: 1.0.0
    capability: cap.messaging.post
    side_effects: irreversible
    requires_approval: true
model_policy:
  tier: balanced
  aliases: [model.balanced-default]
  required_features: [structured_output, tool_use]
  temperature: 0.3
  budget:
    max_cost_usd_per_run: 0.4
execution_policy:
  mode: workflow
  max_steps: 15
  idempotency: required
  triggers: [schedule, manual]
  human_in_the_loop: required_for_side_effects
timeout_policy:
  run_seconds: 900
  step_seconds: 120
  tool_call_seconds: 60
  on_timeout: checkpoint_and_suspend
retry_policy:
  max_attempts: 2
  backoff: exponential
  initial_delay_seconds: 5
  max_delay_seconds: 60
  retry_on: [transient_tool_error, model_rate_limit, timeout]
  never_retry_on: [permission_denied, approval_rejected, policy_violation]
checkpoint_policy:
  strategy: before_side_effects
  resumable: true
  capture: [context, tool_calls, state]
  rollback:
    supported: true
    compensation: manual
state:
  persistence: durable
  stores:
    - name: last-digest
      kind: document
      scope: agent
      retention_days: 180
security:
  classification: internal
  data_handling:
    processes_pii: false
    redact_in_evidence: true
permissions:
  scopes: [analytics:read, messaging:write]
  egress:
    mode: declared_capabilities_only
  side_effects: irreversible
  approvals:
    - before: Posting the digest to a channel
      approver: workspace_member
evaluation:
  suites:
    - id: golden-digest
      file: evals/golden-digest.yaml
      kind: golden
      required: true
      min_pass_rate: 0.85
  promotion_gates:
    require_no_regression: true
    human_approval: true
    min_evaluated_runs: 20
observability:
  tracing: standard
  metrics: [latency, cost, tokens, tool_calls, outcome]
  evidence:
    record_tape: true
    tape_includes: [model_outputs, tool_calls, tool_results, checkpoints]
    retention_days: 60
compatibility:
  runtime_contract:
    min: 1.0.0
  skills_registry: ^1.0.0
  required_runtime_features: [checkpointing, human-approval]
