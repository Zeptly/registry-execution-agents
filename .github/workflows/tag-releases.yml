name: tag-releases

# After a promotion PR merges, create the immutable '<agent-id>@<version>' git tags
# that runtimes use to resolve exact versions.
on:
  push:
    branches: [main]
    paths: ["agents/*/releases.yaml"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create missing release tags
        run: |
          git config user.name "zeptly-registry-bot"
          git config user.email "registry-bot@users.noreply.github.com"
          node scripts/tag-releases.mjs --apply
          git push origin --tags
