apiVersion: registry.zeptly.dev/v1alpha1
kind: ExecutionAgent
metadata:
  id: synthetic.support-ticket-triage
  version: 1.0.0
  registry: execution-agents
  origin:
    type: native
  maturity: canonical
  lifecycle: active
spec:
  name: Support Ticket Triage
  description: Classifies an inbound support ticket, assigns priority and routing,
    and drafts an internal summary.
  purpose:
    summary: Turn a raw support ticket into a structured triage decision so humans
      can act on it faster.
    goals:
      - Classify the ticket category and urgency.
      - Recommend a routing queue with a short justification.
      - Produce a neutral internal summary of at most 80 words.
    nonGoals:
      - Replying to the customer.
      - Modifying the ticket or any customer record.
  tags:
    - support
    - classification
  owners:
    - team:support-platform
  instructions:
    file: prompts/system.md
  contract:
    input:
      schemaFile: contracts/input.schema.json
    output:
      schemaFile: contracts/output.schema.json
    delivery:
      outputMode: inline
      maxInlineBytes: 16384
  executionPolicy:
    mode: workflow
    maxSteps: 8
    idempotency: required
    triggers:
      - event
      - api
      - orchestrator
    humanInTheLoop: never
  timeoutPolicy:
    runSeconds: 120
    stepSeconds: 45
    toolCallSeconds: 20
    onTimeout: fail
  retryPolicy:
    maxAttempts: 3
    backoff: exponential
    initialDelaySeconds: 2
    maxDelaySeconds: 30
    retryOn:
      - transient_tool_error
      - model_rate_limit
      - model_overloaded
      - output_validation_failed
    neverRetryOn:
      - permission_denied
      - policy_violation
      - input_invalid
  checkpointPolicy:
    strategy: per_step
    resumable: true
    capture:
      - context
      - tool_calls
    rollback:
      supported: true
      compensation: none
  state:
    persistence: run
  evaluation:
    suites:
      - id: golden-triage
        file: evals/golden-triage.yaml
        kind: golden
        required: true
        minPassRate: 0.9
    promotionGates:
      requireNoRegression: true
      humanApproval: true
      maxCostIncreasePct: 20
      maxLatencyIncreasePct: 25
      minEvaluatedRuns: 50
  observability:
    tracing: standard
    metrics:
      - latency
      - cost
      - tokens
      - tool_calls
      - retries
      - outcome
    logLevel: info
    evidence:
      recordTape: true
      tapeIncludes:
        - prompts
        - model_outputs
        - tool_calls
        - tool_results
        - checkpoints
      retentionDays: 90
      samplingRate: 1
  modelPolicy:
    tier: fast
    requiredFeatures:
      - structured_output
      - tool_use
    temperature: 0.1
    maxOutputTokens: 1024
    budget:
      maxCostUsdPerRun: 0.05
    models:
      - registry: models
        id: fast-default
      - registry: models
        id: balanced-default
  tools:
    - ref:
        registry: tools
        id: knowledge-search
        version: 1.1.0
      capability:
        registry: capabilities
        id: knowledge.search
        version: 1.0.0
  dataHandling:
    processesPii: true
    mayPersistInputs: false
    redactInEvidence: true
  permissions:
    scopes:
      - knowledge:read
    egress:
      mode: declared_capabilities_only
    sideEffects: none
  compatibility:
    requiredRuntimeFeatures:
      - checkpointing
      - structured-output
