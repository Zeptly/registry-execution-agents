apiVersion: registry.zeptly.dev/v1alpha1
kind: ExecutionAgent
metadata:
  id: synthetic.contract-clause-extractor
  version: 0.1.0
  registry: execution-agents
  origin:
    type: native
  maturity: candidate
  lifecycle: active
spec:
  name: Contract Clause Extractor
  description: Extracts and labels key clauses from a single contract document
    into structured records.
  purpose:
    summary: Identify termination, liability and renewal clauses in one contract and
      return them with source locations.
    goals:
      - Extract clauses with page and paragraph anchors.
      - Never paraphrase legal text; quote verbatim.
    nonGoals:
      - Legal advice or risk scoring.
  tags:
    - legal
    - extraction
  owners:
    - team:legal-ops
  instructions:
    file: prompts/system.md
  contract:
    input:
      schemaFile: contracts/input.schema.json
    output:
      schemaFile: contracts/output.schema.json
  executionPolicy:
    mode: single_pass
    maxSteps: 4
    idempotency: best_effort
    triggers:
      - api
      - manual
    humanInTheLoop: on_demand
  timeoutPolicy:
    runSeconds: 600
  retryPolicy:
    maxAttempts: 2
    retryOn:
      - model_rate_limit
      - model_overloaded
    neverRetryOn:
      - input_invalid
      - policy_violation
  checkpointPolicy:
    strategy: none
    resumable: false
  state:
    persistence: none
  evaluation:
    suites:
      - id: golden-clauses
        file: evals/golden-clauses.yaml
        kind: golden
        required: true
        minPassRate: 0.95
    promotionGates:
      requireNoRegression: true
      humanApproval: true
  observability:
    tracing: standard
    evidence:
      recordTape: false
  modelPolicy:
    tier: frontier
    requiredFeatures:
      - structured_output
      - long_context
    temperature: 0
    models:
      - registry: models
        id: frontier-default
  dataHandling:
    processesPii: true
    mayPersistInputs: false
    redactInEvidence: true
  permissions:
    scopes:
      - documents:read
    egress:
      mode: none
    sideEffects: none
